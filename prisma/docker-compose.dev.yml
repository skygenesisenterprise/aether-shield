services:
  prisma-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: aether-shield-prisma-dev
    ports:
      - "5555:5555"
    environment:
      NODE_ENV: development
      PORT: 5555
      HOSTNAME: 0.0.0.0
    user: root
    volumes:
      - .:/prisma # Montre le code source
      - /prisma/node_modules # Persistance du node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  aether-network-dev:
    driver: bridge

volumes:
  node_modules:
  prisma_cache:
