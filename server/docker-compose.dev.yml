services:
  server-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: aether-shield-server-dev
    ports:
      - "8080:8080"
    environment:
      GOENV: development
      PORT: 8080
      HOSTNAME: 0.0.0.0
    user: root
    volumes:
      - .:/app # Montre le code source
      - /app/go # Persistance du go modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  aether-network-dev:
    driver: bridge

volumes:
  go_modules:
  go_cache:
