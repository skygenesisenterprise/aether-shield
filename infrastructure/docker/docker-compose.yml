# Aether Shield Docker Compose
# =====================================
# This docker-compose.yml file defines the complete infrastructure
# for the Aether Shield enterprise firewall platform
#
# Services included:
# - Next.js frontend (app)
# - Go backend server (server)
# - Caddy reverse proxy
# - Redis cache
# - PostgreSQL database
# - Prometheus monitoring
# - Grafana dashboards
# - Loki logging
#
# Usage:
# - docker-compose up -d          # Start all services
# - docker-compose down         # Stop all services
# - docker-compose logs -f      # View logs
# - docker-compose ps           # List services
#
# =====================================

version: "3.8"

services:
  # ========================================
  # CADDY - Reverse Proxy
  # ========================================
  caddy:
    image: caddy:2.6-alpine
    container_name: aether-shield-caddy
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2019:2019" # Caddy admin
    volumes:
      - ../../Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ../monitoring:/var/log/caddy
    networks:
      - aether-shield-network
    depends_on:
      - app
      - server
    environment:
      - TZ=UTC

  # ========================================
  # NEXT.JS - Frontend Application
  # ========================================
  app:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
      target: app-production
    container_name: aether-shield-app
    restart: unless-stopped
    ports:
      - "3001:3000" # Internal port for Caddy to proxy
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:3000/ws
    volumes:
      - ../../app/.next:/app/.next
      - ../../app/public:/app/public
    networks:
      - aether-shield-network
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ========================================
  # GO SERVER - Backend API
  # ========================================
  server:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
      target: server-production
    container_name: aether-shield-server
    restart: unless-stopped
    ports:
      - "8080:8080" # Internal port for Caddy to proxy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@db:5432/aether_shield?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_jwt_secret_here
      - PORT=8080
    volumes:
      - ../../server/config:/etc/aether-shield/config
    networks:
      - aether-shield-network
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ========================================
  # POSTGRESQL - Database
  # ========================================
  db:
    image: postgres:14-alpine
    container_name: aether-shield-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aether_shield
      - TZ=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../docker/config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aether-shield-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================
  # REDIS - Cache & Session Store
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: aether-shield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ../../infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - aether-shield-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========================================
  # PROMETHEUS - Monitoring
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: aether-shield-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../../infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - aether-shield-network
    depends_on:
      - caddy
      - server
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

  # ========================================
  # GRAFANA - Dashboards
  # ========================================
  grafana:
    image: grafana/grafana:latest
    container_name: aether-shield-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - aether-shield-network
    depends_on:
      - prometheus

  # ========================================
  # LOKI - Logging
  # ========================================
  loki:
    image: grafana/loki:latest
    container_name: aether-shield-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ../../infrastructure/monitoring/loki.yml:/etc/loki/loki.yml
    command: -config.file=/etc/loki/loki.yml
    networks:
      - aether-shield-network

  # ========================================
  # PROMTAIL - Log Collection
  # ========================================
  promtail:
    image: grafana/promtail:latest
    container_name: aether-shield-promtail
    restart: unless-stopped
    volumes:
      - ../../infrastructure/monitoring/promtail.yml:/etc/promtail/promtail.yml
      - ../monitoring:/var/log/caddy
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - aether-shield-network
    depends_on:
      - loki

  # ========================================
  # CLI - Command Line Interface
  # ========================================
  cli:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
      target: cli-production
    container_name: aether-shield-cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - aether-shield-network
    depends_on:
      - server
    environment:
      - NODE_ENV=production

# ========================================
# NETWORKS
# ========================================
networks:
  aether-shield-network:
    driver: bridge
    name: aether-shield-network

# ========================================
# VOLUMES
# ========================================
volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
